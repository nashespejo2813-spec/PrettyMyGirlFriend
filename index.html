<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your My Pretty Girlfriend</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts"></div>

    <!-- Main Card -->
    <div class="container">

        <div class="card">

            <div class="big-heart">❤️</div>

            <h1>Pretty My Girlfriend!</h1>

            <p class="subtitle">
                A little message made specially for you 💕
            </p>

            <h2>To: Mariel Bender 💗</h2>

            <button id="openBtn">
                💌 Open My Message
            </button>

            <div class="message" id="message">

                <p>
                    You are one of the most wonderful people
                    I've ever met. Thank you for bringing
                    happiness, smiles, and beautiful moments
                    into my life. ❤️
                </p>

                <p class="signature">
                    With lots of love, 💕<br>
                    
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
